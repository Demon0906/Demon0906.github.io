  <head>
    <meta charset="utf-8">

    <title>Demon Atelier | Collection Concept</title>
    <style>
      :root {
        --paper: #f7f6f3;
        --ink: #111214;
        --muted: #6e6e6a;
        --line: rgba(17, 18, 20, 0.12);
        --sans: "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", sans-serif;
        --serif: Georgia, "Times New Roman", serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        scroll-behavior: smooth;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      img {
        display: block;
        max-width: 100%;
        -webkit-user-drag: none;
        user-select: none;
      }

      .collection-header {
        position: sticky;
        top: 0;
        z-index: 20;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 24px;
        padding: 18px clamp(20px, 4vw, 54px);
        border-bottom: 1px solid var(--line);
        background: rgba(247, 246, 243, 0.88);
        backdrop-filter: blur(16px);
      }

      .collection-logo img {
        width: 112px;
        height: auto;
      }

      .collection-nav {
        justify-self: center;
        display: flex;
        gap: clamp(18px, 4vw, 48px);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .lang-switch {
        display: inline-grid;
        grid-template-columns: repeat(3, auto);
        gap: 2px;
        border: 1px solid rgba(17, 18, 20, 0.14);
        padding: 3px;
        background: rgba(255, 255, 255, 0.5);
      }

      .lang-switch button {
        min-width: 28px;
        border: 0;
        padding: 7px 8px;
        background: transparent;
        color: rgba(17, 18, 20, 0.54);
        cursor: pointer;
        font: 700 10px var(--sans);
      }

      .lang-switch button.is-active {
        background: rgba(17, 18, 20, 0.9);
        color: #fff;
      }

      .collection-hero {
        position: relative;
        min-height: clamp(320px, 42vw, 520px);
        display: grid;
        align-items: end;
        overflow: hidden;
        border-bottom: 1px solid var(--line);
        background: #dedbd5;
      }

      .collection-hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: var(--cover) center / cover no-repeat;
        filter: saturate(1.02) contrast(0.99) brightness(0.98);
      }

      .collection-hero::after {
        content: "";
        position: absolute;
        inset: 0;
        background:
          linear-gradient(90deg, rgba(247, 246, 243, 0.44), rgba(247, 246, 243, 0.22) 42%, rgba(247, 246, 243, 0.04)),
          linear-gradient(180deg, transparent 34%, rgba(17, 18, 20, 0.09));
      }

      .hero-copy {
        position: relative;
        z-index: 1;
        width: min(760px, 100%);
        padding: clamp(46px, 8vw, 96px) clamp(22px, 5vw, 82px);
      }

      .hero-copy small {
        display: block;
        margin-bottom: 18px;
        color: rgba(17, 18, 20, 0.5);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .hero-copy h1 {
        margin: 0;
        font-family: var(--serif);
        font-size: clamp(34px, 6.4vw, 82px);
        font-weight: 400;
        line-height: 0.98;
        letter-spacing: 0.06em;
      }

      .hero-copy p {
        max-width: 42em;
        margin: 24px 0 0;
        color: rgba(17, 18, 20, 0.64);
        font-size: 13px;
        line-height: 1.9;
      }

      .collection-body {
        display: grid;
      }

      .collection-group {
        display: grid;
        grid-template-columns: minmax(210px, 0.23fr) minmax(0, 0.77fr);
        gap: clamp(20px, 4vw, 58px);
        padding: clamp(28px, 4.6vw, 62px) clamp(20px, 5vw, 82px);
        border-bottom: 1px solid var(--line);
      }

      .group-copy {
        align-self: start;
        position: sticky;
        top: 96px;
      }

      .group-copy small {
        display: block;
        margin-bottom: 14px;
        color: rgba(17, 18, 20, 0.45);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .group-copy h2 {
        margin: 0 0 12px;
        font-size: clamp(22px, 2.8vw, 42px);
        font-weight: 560;
        line-height: 1.15;
        letter-spacing: 0.08em;
      }

      .group-copy p {
        margin: 0;
        color: rgba(17, 18, 20, 0.58);
        font-size: 12px;
        line-height: 1.85;
      }

      .group-slider {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(178px, 22%);
        gap: 12px;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scroll-snap-type: inline mandatory;
        padding-bottom: 14px;
      }

      .group-slide {
        position: relative;
        border: 0;
        padding: 0;
        background: transparent;
        cursor: zoom-in;
        scroll-snap-align: start;
      }

      .group-slide img {
        width: 100%;
        aspect-ratio: 4 / 5;
        object-fit: cover;
        filter: saturate(1) contrast(0.98);
      }

      .group-slide::after {
        content: "";
        position: absolute;
        right: 10px;
        bottom: 10px;
        width: 42px;
        height: 42px;
        border-radius: 999px;
        background:
          rgba(247, 246, 243, 0.42)
          url("assets/brand/demon-atelier-mark-dark.png") center / 74% auto no-repeat;
        opacity: 0.72;
        backdrop-filter: blur(12px);
      }

      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: none;
        place-items: center;
        padding: 28px;
        background: rgba(15, 15, 15, 0.86);
      }

      .lightbox.is-open {
        display: grid;
      }

      .lightbox-frame {
        position: relative;
        display: grid;
        place-items: center;
      }

      .lightbox-frame::after {
        content: "";
        position: absolute;
        right: clamp(16px, 4vw, 34px);
        bottom: clamp(16px, 4vw, 34px);
        width: clamp(58px, 9vw, 96px);
        height: clamp(40px, 6vw, 68px);
        border-radius: 999px;
        background:
          rgba(247, 246, 243, 0.34)
          url("assets/brand/demon-atelier-mark-dark.png") center / 74% auto no-repeat;
        opacity: 0.76;
        backdrop-filter: blur(12px);
        pointer-events: none;
      }

      .lightbox img {
        max-width: min(92vw, 1100px);
        max-height: 84vh;
        object-fit: contain;
      }

      .lightbox-close,
      .lightbox-nav {
        position: absolute;
        border: 1px solid rgba(255, 255, 255, 0.28);
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        cursor: pointer;
        font-size: 24px;
      }

      .lightbox-close {
        top: 22px;
        right: 24px;
      }

      .lightbox-nav {
        top: 50%;
        transform: translateY(-50%);
      }

      .lightbox-prev {
        left: clamp(16px, 4vw, 44px);
      }

      .lightbox-next {
        right: clamp(16px, 4vw, 44px);
      }

      @media (max-width: 760px) {
        .collection-header {
          grid-template-columns: auto 1fr auto;
          gap: 8px 12px;
          padding: 9px 14px 10px;
        }

        .collection-logo img {
          width: 70px;
        }

        .collection-nav {
          grid-column: 1 / -1;
          grid-row: 2;
          justify-self: stretch;
          justify-content: space-between;
          font-size: 9px;
          gap: 8px;
        }

        .lang-switch {
          justify-self: end;
          grid-column: 3;
          grid-row: 1;
          align-self: center;
        }

        .lang-switch button {
          min-width: 25px;
          padding: 6px 7px;
          font-size: 9px;
        }

        .collection-hero {
          min-height: 260px;
        }

        .hero-copy {
          padding: 42px 18px 34px;
        }

        .hero-copy small {
          margin-bottom: 12px;
          font-size: 9px;
        }

        .hero-copy h1 {
          font-size: clamp(34px, 11vw, 48px);
        }

        .hero-copy p {
          max-width: 30em;
          margin-top: 16px;
          font-size: 11px;
          line-height: 1.75;
        }

        .collection-group {
          grid-template-columns: 1fr;
          gap: 16px;
          padding: 22px 14px;
        }

        .group-copy {
          position: static;
        }

        .group-slider {
          grid-auto-columns: minmax(148px, 52%);
          gap: 9px;
        }

        .group-copy small {
          margin-bottom: 10px;
          font-size: 9px;
        }

        .group-copy h2 {
          margin-bottom: 8px;
          font-size: clamp(22px, 8vw, 32px);
        }

        .group-copy p {
          font-size: 11px;
          line-height: 1.7;
        }
      }
    </style>

          },
          quiet: {
            kicker: "Daily / Quiet Light",
            title: "Quiet Light",
            summary: "日常の光、物、スマートフォンに残った小さな断片を集めています。",
            groups: [
              ["Light Notes", "Light Notes", "ガラス、壁、影、展示の光が、普通の空間を静かに整えます。"],
              ["Phone Diary", "Phone Diary", "スマートフォンの記録には、準備されていない軽さと本当らしさがあります。"]
            ]
          }
        }
      };

      const params = new URLSearchParams(window.location.search);
      const collectionKey = collections[params.get("collection")] ? params.get("collection") : "city";
      const collection = collections[collectionKey];

      const mount = document.querySelector("#collections");
      const allPhotos = collection.groups.flatMap((group) => group.photos);
      function textFor(lang) {
        return collectionCopy[lang]?.[collectionKey] || collection;
      }

      function applyLanguage(lang) {
        const text = textFor(lang);
        document.documentElement.lang = lang === "ja" ? "ja" : lang === "en" ? "en" : "zh-CN";
        document.title = `${text.title} | Demon Atelier`;
        document.querySelector("#collection-hero").style.setProperty("--cover", `url("${collection.cover}")`);
        document.querySelector("#collection-kicker").textContent = text.kicker;
        document.querySelector("#collection-title").textContent = text.title;
        document.querySelector("#collection-summary").textContent = text.summary;
        document.querySelectorAll("[data-copy]").forEach((node) => {
          const key = node.dataset.copy;
          if (collectionCopy[lang]?.[key]) node.textContent = collectionCopy[lang][key];
        });
        mount.innerHTML = collection.groups.map((group, index) => {
          const groupText = text.groups?.[index] || [];
          const groupTitle = groupText[0] || group.title || "Untitled";
          const groupLabel = groupText[1] || group.label || collection.kicker || "Collection";
          const groupDescription = groupText[2] || group.description || "";
          return `
            <article class="collection-group">
              <div class="group-copy">
                <small>${String(index + 1).padStart(2, "0")} / ${groupLabel}</small>
                <h2>${groupTitle}</h2>
                <p>${groupDescription}</p>
              </div>
              <div class="group-slider" aria-label="${groupTitle} photos">
                ${group.photos.map((photo) => `
                  <button class="group-slide" type="button" data-index="${allPhotos.indexOf(photo)}" data-full="${photo}">
                    <img src="${photo}" alt="${groupTitle}" loading="lazy" decoding="async" onerror="this.closest('.group-slide')?.remove();">
                  </button>
                `).join("")}
              </div>
            </article>
          `;
        }).join("");
      }
      applyLanguage("zh");

      const lightbox = document.querySelector("#collection-lightbox");
      const lightboxImage = lightbox.querySelector("img");
      const closeButton = lightbox.querySelector(".lightbox-close");
      const prevButton = lightbox.querySelector(".lightbox-prev");
      const nextButton = lightbox.querySelector(".lightbox-next");
      let lightboxIndex = 0;

      function openLightbox(index) {
        lightboxIndex = (index + allPhotos.length) % allPhotos.length;
        lightboxImage.src = allPhotos[lightboxIndex];
        if (!lightbox.classList.contains("is-open")) lightbox.classList.add("is-open");
      }

      function closeLightbox() {
        lightbox.classList.remove("is-open");
        lightboxImage.removeAttribute("src");
      }

      function moveLightbox(direction) {
        openLightbox(lightboxIndex + direction);
      }

      document.addEventListener("click", (event) => {
        const slide = event.target.closest(".group-slide");
        if (!slide) return;
        openLightbox(Number(slide.dataset.index));
      });

      closeButton.addEventListener("click", closeLightbox);
      prevButton.addEventListener("click", () => moveLightbox(-1));
      nextButton.addEventListener("click", () => moveLightbox(1));

      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) closeLightbox();
      });

      document.addEventListener("keydown", (event) => {
        if (!lightbox.classList.contains("is-open")) return;
        if (event.key === "Escape") closeLightbox();
        if (event.key === "ArrowLeft") moveLightbox(-1);
        if (event.key === "ArrowRight") moveLightbox(1);
      });

      document.querySelectorAll(".lang-switch button").forEach((button) => {
        button.addEventListener("click", () => {
          const lang = button.dataset.lang;
          document.querySelectorAll(".lang-switch button").forEach((item) => item.classList.toggle("is-active", item === button));
          applyLanguage(lang);
        });
      });
    </script>
  </body>
</html>
