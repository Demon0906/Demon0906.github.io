<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Demon Photography 人像摄影作品，按模特分组展示。">
    <title>人像摄影 | Demon Photography</title>
    <link rel="stylesheet" href="styles.css?v=atelier-20260705d">
  </head>
  <body class="detail-page portrait-page cold-gallery-preview">
    <header class="detail-header">
      <a class="brand dark-brand" href="index.html" aria-label="返回 Demon 首页">
        <span class="brand-mark">D</span>
        <span>Demon</span>
      </a>
      <nav class="detail-nav" aria-label="Portrait navigation">
        <a href="index.html#portfolio">作品集</a>
        <a href="about.html">关于我</a>
        <a href="index.html#contact">联系方式</a>
      </nav>
    </header>

    <main>
      <section class="portrait-hero">
        <p class="eyebrow">Portrait</p>
        <h1 id="portrait-title">人像摄影</h1>
        <p id="portrait-intro">把人物的状态放进光线、地点和时间里，让每一组肖像都保留自己的节奏。</p>
        <div class="portrait-tabs" id="portrait-tabs" aria-label="人像摄影分类"></div>
      </section>

      <section class="portrait-projects" id="portrait-projects" aria-label="模特作品集"></section>
    </main>

    <dialog class="lightbox" id="portrait-lightbox" aria-label="人像作品预览">
      <button class="lightbox-close" type="button" aria-label="关闭预览">×</button>
      <button class="lightbox-nav lightbox-prev" type="button" aria-label="上一张">‹</button>
      <span class="lightbox-frame">
        <img id="portrait-lightbox-image" class="protected-media" alt="" draggable="false">
      </span>
      <button class="lightbox-nav lightbox-next" type="button" aria-label="下一张">›</button>
      <div class="lightbox-caption">
        <h3 id="portrait-lightbox-title"></h3>
        <p id="portrait-lightbox-meta"></p>
      </div>
    </dialog>

    <div class="privacy-toast" id="privacy-toast" role="status" aria-live="polite">作品仅供在线预览，请勿保存或截图传播。</div>

    <script src="gallery-data.js?v=atelier-20260705d"></script>
    <script src="protection.js?v=atelier-20260705d"></script>
    <script>
      const mount = document.querySelector("#portrait-projects");
      const tabsMount = document.querySelector("#portrait-tabs");
      const pageTitle = document.querySelector("#portrait-title");
      const pageIntro = document.querySelector("#portrait-intro");
      const lightbox = document.querySelector("#portrait-lightbox");
      const lightboxImage = document.querySelector("#portrait-lightbox-image");
      const lightboxTitle = document.querySelector("#portrait-lightbox-title");
      const lightboxMeta = document.querySelector("#portrait-lightbox-meta");
      const lightboxPrev = document.querySelector(".lightbox-prev");
      const lightboxNext = document.querySelector(".lightbox-next");
      const params = new URLSearchParams(window.location.search);
      const selectedCollection = params.get("collection") || "model-show";
      const collections = window.portraitCollections || [];
      const activeCollection = collections.find((item) => item.collection === selectedCollection) || collections[0];
      let lightboxState = { photoIndex: 0 };

      function getText(value) {
        return typeof value === "string" ? value : value.zh;
      }

      function getGroup(groupId) {
        return activeCollection.groups.find((group) => group.id === groupId);
      }

      function getAllPortraitPhotos() {
        return activeCollection.groups.flatMap((group) =>
          group.photos.map((src, photoIndex) => ({
            group,
            groupId: group.id,
            photoIndex,
            src,
          })),
        );
      }

      function getFlatPhotoIndex(groupId, photoIndex) {
        return getAllPortraitPhotos().findIndex((item) => item.groupId === groupId && item.photoIndex === Number(photoIndex));
      }

      function renderTabs() {
        tabsMount.innerHTML = collections
          .map(
            (collection) => `
              <a class="${collection.collection === activeCollection.collection ? "is-active" : ""}" href="portrait.html?collection=${collection.collection}">
                ${getText(collection.title)}
              </a>
            `,
          )
          .join("");
      }

      function renderPortraitProjects() {
        pageTitle.textContent = getText(activeCollection.title);
        pageIntro.textContent = getText(activeCollection.summary);
        mount.innerHTML = activeCollection.groups
          .filter((group) => group.photos.length)
          .map((group) => {
            const photos = group.photos
              .map(
                (src, index) => {
                  const info = window.photoInfoFromPath(src);
                  const hasInfo = Object.keys(info.fields).length > 0;
                  const meta = info.meta || getText(activeCollection.place);
                  const details = hasInfo
                    ? Object.entries(info.fields)
                        .filter(([key]) => key !== "模特" && key !== "模特名")
                        .map(([key, value]) => `${key}: ${value}`)
                        .join(" / ")
                    : `${getText(activeCollection.title)} / ${group.title}`;
                  return `
                  <button class="portrait-photo" type="button" data-group="${group.id}" data-photo="${index}">
                    <img
                      src="${window.thumbImage(src)}"
                      onerror="this.onerror=null;this.src='${window.localImage(src)}';"
                      alt="${group.title}"
                      loading="lazy"
                      decoding="async"
                      draggable="false"
                    >
                    <span class="portrait-photo-info">
                      <small>${meta}</small>
                      <em>${details}</em>
                    </span>
                  </button>
                `;
                },
              )
              .join("");
            return `
              <article class="portrait-project" id="${group.id}">
                <div class="portrait-project-heading">
                  <p class="eyebrow">Model</p>
                  <h2>${group.title}</h2>
                  <p>${getText(activeCollection.title)} · ${getText(activeCollection.place)}</p>
                  <span>${group.description || "在自然光和真实场景中保留人物的独特气质，让画面拥有更安静的叙事感。"}</span>
                </div>
                <div class="portrait-photo-grid">${photos}</div>
              </article>
            `;
          })
          .join("");

        if (window.location.hash) {
          requestAnimationFrame(() => {
            document.querySelector(window.location.hash)?.scrollIntoView({ block: "start" });
          });
        }
      }

      function openPortraitLightbox(groupId, photoIndex) {
        const allPhotos = getAllPortraitPhotos();
        const flatIndex = getFlatPhotoIndex(groupId, photoIndex);
        const item = allPhotos[flatIndex];
        if (!item) return;
        const info = window.photoInfoFromPath(item.src);
        const hasInfo = Object.keys(info.fields).length > 0;
        lightboxState = { photoIndex: flatIndex };
        lightboxImage.src = window.localImage(item.src);
        lightboxImage.alt = item.group.title;
        lightboxTitle.textContent = item.group.title;
        lightboxMeta.textContent = hasInfo ? info.meta || info.caption : `${getText(activeCollection.title)} / ${item.group.title}`;
        if (!lightbox.open) lightbox.showModal();
        requestAnimationFrame(() => {
          lightbox.scrollTop = 0;
          lightbox.scrollLeft = 0;
        });
      }

      function movePortraitLightbox(direction) {
        const allPhotos = getAllPortraitPhotos();
        if (!allPhotos.length) return;
        const nextIndex = (lightboxState.photoIndex + direction + allPhotos.length) % allPhotos.length;
        const next = allPhotos[nextIndex];
        openPortraitLightbox(next.groupId, next.photoIndex);
      }

      mount.addEventListener("click", (event) => {
        const button = event.target.closest(".portrait-photo");
        if (!button) return;
        openPortraitLightbox(button.dataset.group, button.dataset.photo);
      });

      document.querySelector(".lightbox-close").addEventListener("click", () => lightbox.close());
      lightboxPrev.addEventListener("click", () => movePortraitLightbox(-1));
      lightboxNext.addEventListener("click", () => movePortraitLightbox(1));
      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) lightbox.close();
      });
      document.addEventListener("keydown", (event) => {
        if (!lightbox.open) return;
        if (event.key === "ArrowLeft") movePortraitLightbox(-1);
        if (event.key === "ArrowRight") movePortraitLightbox(1);
      });

      renderTabs();
      renderPortraitProjects();
    </script>
  </body>
</html>
