<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Demon Atelier | Portrait Concept</title>
    <style>
      :root {
        --paper: #f7f6f3;
        --ink: #111214;
        --muted: #6e6e6a;
        --line: rgba(17, 18, 20, 0.12);
        --sans: "Helvetica Neue", Arial, "PingFang SC", "Hiragino Sans GB", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
      }

      a {
        color: inherit;
        text-decoration: none;
      }

      img {
        display: block;
        max-width: 100%;
        -webkit-user-drag: none;
        user-select: none;
      }

      .portrait-header {
        position: sticky;
        top: 0;
        z-index: 20;
        display: grid;
        grid-template-columns: auto 1fr auto;
        align-items: center;
        gap: 24px;
        padding: 18px clamp(20px, 4vw, 54px);
        border-bottom: 1px solid var(--line);
        background: rgba(247, 246, 243, 0.88);
        backdrop-filter: blur(16px);
      }

      .portrait-logo img {
        width: 112px;
        height: auto;
      }

      .portrait-nav {
        justify-self: center;
        display: flex;
        gap: clamp(18px, 4vw, 48px);
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }

      .lang-switch {
        display: inline-grid;
        grid-template-columns: repeat(3, auto);
        gap: 2px;
        border: 1px solid rgba(17, 18, 20, 0.14);
        padding: 3px;
        background: rgba(255, 255, 255, 0.5);
      }

      .lang-switch button {
        min-width: 28px;
        border: 0;
        padding: 7px 8px;
        background: transparent;
        color: rgba(17, 18, 20, 0.54);
        cursor: pointer;
        font: 700 10px var(--sans);
      }

      .lang-switch button.is-active {
        background: rgba(17, 18, 20, 0.9);
        color: #fff;
      }

      .portrait-hero {
        display: grid;
        grid-template-columns: minmax(240px, 0.33fr) minmax(0, 0.67fr);
        gap: clamp(28px, 5vw, 78px);
        padding: clamp(42px, 6vw, 84px) clamp(20px, 5vw, 82px) 34px;
        border-bottom: 1px solid var(--line);
      }

      .portrait-hero h1 {
        max-width: 9em;
        margin: 0;
        font-size: clamp(28px, 4.5vw, 64px);
        font-weight: 560;
        line-height: 1.05;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      .portrait-hero p {
        max-width: 42em;
        margin: 0;
        color: rgba(17, 18, 20, 0.62);
        font-size: 13px;
        line-height: 1.9;
      }

      .model-list {
        display: grid;
      }

      .model-section {
        display: grid;
        grid-template-columns: minmax(220px, 0.24fr) minmax(0, 0.76fr);
        gap: clamp(24px, 4vw, 64px);
        padding: clamp(30px, 4.2vw, 58px) clamp(20px, 5vw, 82px);
        border-bottom: 1px solid var(--line);
      }

      .model-copy {
        align-self: start;
        position: sticky;
        top: 98px;
      }

      .model-copy small {
        display: block;
        margin-bottom: 16px;
        color: rgba(17, 18, 20, 0.46);
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      .model-copy h2 {
        margin: 0 0 14px;
        font-size: clamp(24px, 3vw, 44px);
        font-weight: 560;
        letter-spacing: 0.08em;
      }

      .model-copy p {
        margin: 0;
        color: rgba(17, 18, 20, 0.58);
        font-size: 12px;
        line-height: 1.85;
      }

      .model-slider {
        display: grid;
        grid-auto-flow: column;
        grid-auto-columns: minmax(220px, 31%);
        gap: 12px;
        overflow-x: auto;
        overscroll-behavior-inline: contain;
        scroll-snap-type: inline mandatory;
        padding-bottom: 14px;
      }

      .model-slide {
        position: relative;
        border: 0;
        padding: 0;
        background: transparent;
        cursor: zoom-in;
        scroll-snap-align: start;
      }

      .model-slide img {
        width: 100%;
        aspect-ratio: 4 / 5;
        object-fit: cover;
        filter: saturate(0.88) contrast(0.96);
      }

      .model-slide::after {
        content: "";
        position: absolute;
        right: 10px;
        bottom: 10px;
        width: 44px;
        height: 44px;
        border-radius: 999px;
        background:
          rgba(247, 246, 243, 0.42)
          url("assets/brand/demon-atelier-mark-dark.png") center / 74% auto no-repeat;
        opacity: 0.72;
        backdrop-filter: blur(12px);
      }

      .lightbox {
        position: fixed;
        inset: 0;
        z-index: 80;
        display: none;
        place-items: center;
        padding: 28px;
        background: rgba(15, 15, 15, 0.86);
      }

      .lightbox.is-open {
        display: grid;
      }

      .lightbox img {
        max-width: min(92vw, 1100px);
        max-height: 84vh;
        object-fit: contain;
      }

      .lightbox button {
        position: absolute;
        top: 22px;
        right: 24px;
        border: 1px solid rgba(255, 255, 255, 0.28);
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        cursor: pointer;
        font-size: 24px;
      }

      @media (max-width: 760px) {
        .portrait-header {
          grid-template-columns: 1fr;
          gap: 12px;
        }

        .portrait-nav {
          justify-self: stretch;
          justify-content: space-between;
        }

        .lang-switch {
          justify-self: start;
        }

        .portrait-hero,
        .model-section {
          grid-template-columns: 1fr;
        }

        .model-copy {
          position: static;
        }

        .model-slider {
          grid-auto-columns: minmax(230px, 76%);
        }
      }
    </style>
  </head>
  <body>
    <header class="portrait-header">
      <a class="portrait-logo" href="concept-minimal.html" aria-label="Demon Atelier">
        <img src="assets/brand/demon-atelier-logo-dark.png" alt="Demon Atelier">
      </a>
      <nav class="portrait-nav">
        <a href="concept-minimal.html">Home</a>
        <a href="#models">Models</a>
        <a href="concept-minimal.html#contact">Contact</a>
      </nav>
      <div class="lang-switch" aria-label="Language">
        <button type="button" class="is-active">中</button>
        <button type="button">EN</button>
        <button type="button">日</button>
      </div>
    </header>

    <main>
      <section class="portrait-hero">
        <h1>Portrait Index</h1>
        <p>人像在这里按模特分成不同章节。每一个板块保留简洁介绍，照片采用横向滑动播放，点开后可以放大查看，让测试版在人像浏览上更接近一个轻量的摄影画册。</p>
      </section>
      <section class="model-list" id="models"></section>
    </main>

    <div class="lightbox" id="portrait-lightbox" aria-label="照片预览">
      <button type="button" aria-label="关闭">×</button>
      <img alt="">
    </div>

    <script src="gallery-data.js?v=atelier-20260719-story-mobile"></script>
    <script>
      const modelMount = document.querySelector("#models");
      const modelMap = new Map();
      (window.portraitCollections || []).forEach((collection) => {
        (collection.groups || []).forEach((group) => {
          if (!modelMap.has(group.title)) {
            modelMap.set(group.title, {
              title: group.title,
              description: group.description,
              photos: []
            });
          }
          modelMap.get(group.title).photos.push(...(group.photos || []));
        });
      });

      const models = [...modelMap.values()]
        .map((model) => ({ ...model, photos: [...new Set(model.photos)].slice(0, 8) }))
        .filter((model) => model.photos.length)
        .slice(0, 10);

      modelMount.innerHTML = models.map((model, index) => `
        <article class="model-section">
          <div class="model-copy">
            <small>${String(index + 1).padStart(2, "0")} / Model</small>
            <h2>${model.title}</h2>
            <p>${model.description || "以光线、姿态和场景整理成一组安静的人像章节。"}</p>
          </div>
          <div class="model-slider" aria-label="${model.title} photos">
            ${model.photos.map((photo) => `
              <button class="model-slide" type="button" data-full="${window.localImage(photo)}">
                <img src="${window.thumbImage(photo)}" data-full="${window.localImage(photo)}" alt="${model.title}" loading="lazy">
              </button>
            `).join("")}
          </div>
        </article>
      `).join("");

      document.querySelectorAll(".model-slide img").forEach((image) => {
        image.addEventListener("error", () => {
          if (image.src !== image.dataset.full) image.src = image.dataset.full;
        }, { once: true });
      });

      const lightbox = document.querySelector("#portrait-lightbox");
      const lightboxImage = lightbox.querySelector("img");
      document.addEventListener("click", (event) => {
        const slide = event.target.closest(".model-slide");
        if (!slide) return;
        lightboxImage.src = slide.dataset.full;
        lightbox.classList.add("is-open");
      });
      lightbox.querySelector("button").addEventListener("click", () => {
        lightbox.classList.remove("is-open");
        lightboxImage.removeAttribute("src");
      });
      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) {
          lightbox.classList.remove("is-open");
          lightboxImage.removeAttribute("src");
        }
      });
      document.querySelectorAll(".lang-switch button").forEach((button) => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".lang-switch button").forEach((item) => item.classList.toggle("is-active", item === button));
        });
      });
    </script>
  </body>
</html>
