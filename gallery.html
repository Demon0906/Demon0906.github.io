<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Demon Photography 摄影集详情。">
    <title>摄影集 | Demon Photography</title>
    <link rel="stylesheet" href="styles.css?v=atelier-20260719-compact-cards">
  </head>
  <body class="detail-page gallery-page">
    <header class="detail-header">
      <a class="brand dark-brand" href="index.html" aria-label="返回 Demon 首页">
        <span class="brand-mark">D</span>
        <span>Demon</span>
      </a>
      <nav class="detail-nav" aria-label="Gallery navigation">
        <a href="index.html#portfolio">作品集</a>
        <a href="about.html">关于我</a>
        <a href="index.html#contact">联系方式</a>
      </nav>
    </header>

    <main>
      <section class="gallery-hero" id="gallery-hero"></section>
      <section class="gallery-body" id="gallery-body"></section>
    </main>

    <dialog class="lightbox" id="gallery-lightbox" aria-label="摄影作品预览">
      <button class="lightbox-close" type="button" aria-label="关闭预览">×</button>
      <button class="lightbox-nav lightbox-prev" type="button" aria-label="上一张">‹</button>
      <span class="lightbox-frame">
        <img id="gallery-lightbox-image" class="protected-media" alt="" draggable="false">
      </span>
      <button class="lightbox-nav lightbox-next" type="button" aria-label="下一张">›</button>
      <div class="lightbox-caption">
        <h3 id="gallery-lightbox-title"></h3>
        <p id="gallery-lightbox-meta"></p>
      </div>
    </dialog>

    <div class="privacy-toast" id="privacy-toast" role="status" aria-live="polite">作品仅供在线预览，请勿保存或截图传播。</div>

    <script src="gallery-data.js?v=atelier-20260719-story-mobile"></script>
    <script src="protection.js?v=atelier-20260705d"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      const sectionId = params.get("section");
      const projectId = params.get("project");
      const hero = document.querySelector("#gallery-hero");
      const body = document.querySelector("#gallery-body");
      const lightbox = document.querySelector("#gallery-lightbox");
      const lightboxImage = document.querySelector("#gallery-lightbox-image");
      const lightboxTitle = document.querySelector("#gallery-lightbox-title");
      const lightboxMeta = document.querySelector("#gallery-lightbox-meta");
      const closeButton = document.querySelector(".lightbox-close");
      const prevButton = document.querySelector(".lightbox-prev");
      const nextButton = document.querySelector(".lightbox-next");
      const sections = window.sitePortfolioSections || [];
      const section =
        sections.find((item) => item.id === sectionId) ||
        sections.find((item) => item.projects.some((project) => project.id === projectId)) ||
        sections.find((item) => item.id !== "portrait");
      const project = section?.projects.find((item) => item.id === projectId) || section?.projects[0];
      let lightboxIndex = 0;

      function getText(value) {
        return typeof value === "string" ? value : value?.zh || "";
      }

      function escapeHtml(value) {
        return String(value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#039;");
      }

      function photoCaption(src, index) {
        const info = window.photoInfoFromPath(src);
        const meta = info.meta || getText(project.place);
        const detail = Object.entries(info.fields)
          .map(([key, value]) => `${key}: ${value}`)
          .join(" / ");
        const fallback = [
          "光停在画面里，像一次安静的呼吸。",
          "色彩与形状在这里相遇，留下一个可以慢慢观看的瞬间。",
          "这张照片保留了现场的温度，也保留了时间经过时的轻微痕迹。",
          "风、光和距离一起构成了画面的情绪。",
        ];
        return {
          title: info.title === "照片记录" ? `Frame ${String(index + 1).padStart(2, "0")}` : info.title,
          meta,
          detail: detail || fallback[index % fallback.length],
        };
      }

      function openLightbox(index) {
        const src = project.photos[index];
        if (!src) return;
        const caption = photoCaption(src, index);
        lightboxIndex = index;
        lightboxImage.src = window.localImage(src);
        lightboxImage.alt = getText(project.title);
        lightboxTitle.textContent = getText(project.title);
        lightboxMeta.textContent = caption.meta || caption.detail;
        if (!lightbox.open) lightbox.showModal();
        requestAnimationFrame(() => {
          lightbox.scrollTop = 0;
          lightbox.scrollLeft = 0;
        });
      }

      function moveLightbox(direction) {
        const nextIndex = (lightboxIndex + direction + project.photos.length) % project.photos.length;
        openLightbox(nextIndex);
      }

      function renderHero() {
        const cover = project.photos[0];
        const sectionLabels = {
          nature: "Nature",
          city: "City",
          daily: "Daily",
          stories: "Story",
        };
        hero.style.setProperty("--gallery-cover", `url("${window.thumbImage(cover)}")`);
        hero.innerHTML = `
          <p class="eyebrow">${sectionLabels[section.id] || "Gallery"}</p>
          <h1>${getText(project.title)}</h1>
          <p>${getText(project.summary)}</p>
          <div class="gallery-meta">
            <span>${project.date}</span>
            <span>${getText(project.place)}</span>
            <span>${project.photos.length} frames</span>
          </div>
        `;
      }

      function renderGalleryGrid() {
        body.className = "gallery-body gallery-grid";
        body.innerHTML = `${renderProjectTabs()}${project.photos
          .map((src, index) => {
            const caption = photoCaption(src, index);
            return `
              <article class="gallery-frame">
                <button type="button" data-index="${index}" aria-label="查看 ${escapeHtml(getText(project.title))}">
                  <img
                    class="protected-media"
                    src="${window.thumbImage(src)}"
                    onerror="this.onerror=null;this.src='${window.localImage(src)}';"
                    alt="${escapeHtml(getText(project.title))}"
                    loading="lazy"
                    decoding="async"
                    draggable="false"
                  >
                </button>
                <div class="gallery-frame-copy">
                  <p>${caption.meta}</p>
                  <span>${caption.detail}</span>
                </div>
              </article>
            `;
          })
          .join("")}`;
      }

      function renderProjectTabs() {
        if (!section?.projects || section.projects.length < 2) return "";
        const links = section.projects
          .map((item) => {
            const active = item.id === project.id ? " is-active" : "";
            return `<a class="gallery-project-tab${active}" href="gallery.html?section=${section.id}&project=${item.id}">${escapeHtml(getText(item.title))}</a>`;
          })
          .join("");
        return `<nav class="gallery-project-tabs" aria-label="摄影集切换">${links}</nav>`;
      }

      function storyForProject() {
        if (project.story) return project.story;
        const title = getText(project.title);
        return {
          kicker: "A playful frame",
          title,
          paragraphs: [
            `有些拍摄不是从宏大的计划开始，而是从一个让人会心一笑的对象开始。${title} 的有趣之处就在这里：它把日常里看似轻巧的东西，认真地请到镜头前。`,
            "当照片不再急着证明什么，观察就会变得轻松。一个表情、一点颜色、一处摆放的角度，都可能成为画面里的小转折。摄影好玩的地方，也许正是它让普通的瞬间突然有了主角。",
            "所以这组照片更像一段可以慢慢翻看的现场笔记：它记录被看见的过程，也记录拍摄者和被拍摄对象之间，那一点点试探、靠近和发现。"
          ],
        };
      }

      function storyPhotoNote(caption, index) {
        const notesByProject = {
          "story-graduation-season": [
            "从这张开始，告别不是沉重的词，而是被草地、风和笑容托起来的瞬间。",
            "证书和衣角进入画面时，毕业这件事突然有了可以触摸的形状。",
            "镜头靠近一点，表情里的期待和舍不得就会同时出现。",
            "最后一张像一个轻轻的句号：拍完以后，大家就要走向不同的路了。",
          ],
          "stories-e4ba94e69da1": [
            "让角色先占住画面，像一场小剧场正式开灯。",
            "靠近之后，玩偶的表情会变得很有存在感，仿佛它真的知道镜头在哪里。",
            "几只角色放在一起，关系感就出现了，照片也从静物变成了小故事。",
            "背景颜色退到后面，主角的性格反而更明显。",
            "这类照片好玩的地方，是你会忍不住继续替它们安排下一幕。",
          ],
          "story-light-notes": [
            "第一张像见面：熊大的笑容先把故事打开。",
            "换一个角度，它就不只是玩偶，而像一个认真参与毕业季的小伙伴。",
            "光线落在毛绒上，时间感会变得很柔软。",
            "最后留下的不是摆拍，而是一段被带着走了很久的陪伴。",
          ],
        };
        const notes = notesByProject[project.id] || [
          "第一眼先交给画面本身：颜色、距离和姿态会替故事开场。",
          "换一个角度以后，照片里的重点也会移动，新的情绪就从边缘长出来。",
          "有时最有趣的不是完美构图，而是现场留下的一点偶然。",
          "当一组照片被放在一起，它们开始像句子一样互相回答。",
          "最后留下的，不只是画面，也是拍摄时那份好奇心。",
        ];
        return notes[index % notes.length] || caption.detail;
      }

      function renderStory() {
        const story = storyForProject();
        body.className = "gallery-body story-article";
        const storyFigure = (src, index) => `
          <figure class="story-image story-image-${index % 5}" data-index="${index}">
            <button type="button" data-index="${index}" aria-label="查看 ${escapeHtml(getText(project.title))} ${index + 1}">
              <img
                class="protected-media"
                src="${window.thumbImage(src)}"
                onerror="this.onerror=null;this.src='${window.localImage(src)}';"
                alt="${escapeHtml(getText(project.title))}"
                loading="lazy"
                decoding="async"
                draggable="false"
              >
            </button>
            <figcaption>
              <span>${String(index + 1).padStart(2, "0")}</span>
              <p>${storyPhotoNote(photoCaption(src, index), index)}</p>
            </figcaption>
          </figure>
        `;
        const storyBlocks = story.paragraphs
          .map((paragraph, index) => `
            <section class="story-flow-block">
              <p>${paragraph}</p>
              ${project.photos[index] ? storyFigure(project.photos[index], index) : ""}
            </section>
          `)
          .join("");
        const remainingImages = project.photos
          .slice(story.paragraphs.length)
          .map((src, index) => storyFigure(src, index + story.paragraphs.length))
          .join("");
        body.innerHTML = `
          ${renderProjectTabs()}
          <article class="story-card story-card--flow">
            <div class="story-copy">
              <p class="eyebrow">${story.kicker}</p>
              <h2>${story.title}</h2>
              <div class="story-flow">${storyBlocks}</div>
            </div>
            ${remainingImages ? `<div class="story-images story-images-extra" aria-label="摄影故事照片">${remainingImages}</div>` : ""}
          </article>
        `;
      }

      if (!project) {
        hero.innerHTML = "<h1>没有找到这个摄影集</h1>";
      } else {
        document.title = `${getText(project.title)} | Demon Photography`;
        renderHero();
        if (section.id === "stories" || project.story) renderStory();
        else renderGalleryGrid();
      }

      body.addEventListener("click", (event) => {
        const trigger = event.target.closest("[data-index]");
        if (!trigger) return;
        openLightbox(Number(trigger.dataset.index));
      });

      closeButton.addEventListener("click", () => lightbox.close());
      prevButton.addEventListener("click", () => moveLightbox(-1));
      nextButton.addEventListener("click", () => moveLightbox(1));
      lightbox.addEventListener("click", (event) => {
        if (event.target === lightbox) lightbox.close();
      });
      document.addEventListener("keydown", (event) => {
        if (!lightbox.open) return;
        if (event.key === "ArrowLeft") moveLightbox(-1);
        if (event.key === "ArrowRight") moveLightbox(1);
      });
    </script>
  </body>
</html>
